          type: integer
          example: 10000
        requests_per_month:
          type: integer
          example: 250000
        max_content_per_request:
          type: integer
          example: 10
    LicenseDocument:
      type: object
      description: RSL (Real Simple License) document. Machine-readable license that AI agents fetch from the licenseUrl to
        understand content usage terms before accessing content. The GET /licenses/{license_id} endpoint serves this document
        publicly (no auth required).
      required:
      - license_id
      - license_url
      - version
      - status
      - allowed_uses
      - created_at
      - updated_at
      properties:
        license_id:
          type: string
          example: lic_standard_inference_v1
        license_url:
          type: string
          format: uri
          example: https://api.publisher.com/ai-content-monetization/v1/licenses/lic_standard_inference_v1
          description: Public URL where this license is served. This is the licenseUrl referenced in CoMP Package responses,
            CloudFront Response Header Policy, and x402 extra field.
        version:
          type: string
          example: 1.0.0
        status:
          type: string
          enum:
          - active
          - draft
          - archived
          example: active
        title:
          type: string
          example: Standard AI Content Access License
        description:
          type: string
        publisher:
          type: object
          properties:
            name:
              type: string
              example: Example Publisher Inc.
            contact:
              type: string
              format: email
            jurisdiction:
              type: string
              example: United States
        allowed_uses:
          type: array
          description: Permitted uses. Maps directly to CoMP aisysuse.function values.
          items:
            type: string
            enum:
            - inference
            - retrieval
            - summarization
            - citation
            - training
            - fine_tuning
            - indexing
          example:
          - inference
          - retrieval
          - summarization
          - citation
        prohibited_uses:
          type: array
          items:
            type: string
          example:
          - training
          - fine_tuning
        attribution_required:
          type: boolean
          example: true
        attribution_format:
          type: string
          example: 'Source: {title} by {author}, {publication_date}. {url}'
          description: Required attribution format. Variables in {braces} substituted from content metadata.
        geographic_restrictions:
          type: array
          items:
            type: string
          example: []
          description: ISO 3166-1 alpha-2 country codes where this license is NOT valid
        content_categories:
          type: array
          items:
            type: integer
          example:
          - 111
          - 126
          description: IAB taxonomy category IDs this license applies to. Empty means all.
        pricing_tiers:
          type: array
          items:
            $ref: '#/components/schemas/LicensePricingTier'
        rate_limits:
          $ref: '#/components/schemas/LicenseRateLimits'
        expiry:
          type: object
          properties:
            type:
              type: string
              enum:
              - perpetual
              - fixed_date
              - rolling_days
              example: perpetual
            expires_at:
              type: string
              format: date-time
            rolling_days:
              type: integer
        comp_compatible:
          type: boolean
          example: true
          description: Whether this license can be negotiated via the CoMP protocol
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        current_version_number:
          type: integer
          example: 1
    CreateLicenseRequest:
