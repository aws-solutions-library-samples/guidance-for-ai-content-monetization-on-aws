        \ format\n  - Where to find RSL license documents (licenseurl)\n  - Where to send usage reporting (reporturl)\n  -\
        \ Supported authentication methods (aiauth values)\n\nThis is a capability advertisement only. It does not issue tokens,\n\
        manage sessions, or handle payment \u2014 those are out of scope for CoMP v1.0.\n\nPublic endpoint \u2014 no authentication\
        \ required.\nFollows well-known URI convention (RFC 8615)."
      operationId: getCompDiscovery
      tags:
      - Discovery
      security:
      - {}
      responses:
        '200':
          description: CoMP v1.0 discovery document
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=3600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompDiscoveryDocument'
              example:
                comp_version: '1.0'
                seller: medinsight.com
                content_endpoints:
                - path: /query
                  method: POST
                  description: Keyword and IAB category filtered content query
                  delivery_formats:
                  - 2
                  - 3
                license_catalog_url: https://api.medinsight.com/ai-content-monetization/v1/licenses
                default_license_url: https://api.medinsight.com/ai-content-monetization/v1/licenses/lic_default_v1
                report_url: https://api.medinsight.com/ai-content-monetization/v1/log
                supported_auth_methods:
                - 1
                - 2
                - 4
                llms_txt_url: https://api.medinsight.com/ai-content-monetization/v1/llms.txt
        '503':
          description: Service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompError'
      x-audience: partner
