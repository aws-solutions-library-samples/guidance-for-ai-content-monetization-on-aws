            context_elements:
              type: array
              items:
                type: string
              description: Relevant page elements or data
            current_filters:
              type: object
              description: Current filters or selections on the page
        session_id:
          type: string
          description: Chat session identifier for conversation continuity
          example: session_abc123
    AnalyticsAgentChatResponse:
      type: object
