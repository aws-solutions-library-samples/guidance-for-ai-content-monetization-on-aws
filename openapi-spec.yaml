    CompDiscoveryDocument:
      type: object
      description: "Served at /.well-known/comp.json. Advertises CoMP v1.0 capabilities\nto AI agents. Not part of the official\
        \ CoMP v1.0 spec \u2014 this is a\nwell-known URI convention (RFC 8615) extension.\n"
      required:
      - comp_version
      - seller
      - content_endpoints
      properties:
        comp_version:
          type: string
          example: '1.0'
          description: CoMP spec version (IAB Tech Lab CoMP v1.0, April 28 2026)
        seller:
          type: string
          example: medinsight.com
          description: Canonical domain of the content owner
        content_endpoints:
          type: array
          description: Endpoints that accept CompAISystemRequest format
          items:
            type: object
            properties:
              path:
                type: string
                example: /query
              method:
                type: string
                example: POST
              description:
                type: string
              delivery_formats:
                type: array
                description: CoMP retrieval type codes. 2=API, 3=MCP
                items:
                  type: integer
                example:
                - 2
                - 3
        license_catalog_url:
          type: string
          format: uri
          description: URL to browse all available RSL license documents
        default_license_url:
          type: string
          format: uri
          description: Default licenseurl used in Package responses
        report_url:
          type: string
          format: uri
          description: URL where agents send usage reporting (maps to /log)
        supported_auth_methods:
          type: array
          description: CoMP aiauth integer values accepted. 1=IP, 2=Token, 4=Agent Registry
          items:
            type: integer
          example:
          - 1
          - 2
          - 4
        llms_txt_url:
          type: string
          format: uri
          description: URL to llms.txt manifest for content discovery
    CompResponseMeta:
      type: object
      description: 'Non-CoMP metadata appended to Package responses for agent convenience.

        Includes query tracking, similarity scores, and attribution format.

        '
      properties:
        query_id:
          type: string
          example: comp_a1b2c3d4
          description: Request tracking ID for log correlation
        total_results:
          type: integer
          example: 5
          minimum: 0
          description: Number of supported Text assets represented in this response after filtering and identity deduplication; not a full-corpus total.
        similarity_scores:
          type: array
          description: Cosine similarity scores for each asset in scope.text
          items:
            type: number
          example:
          - 0.94
          - 0.89
          - 0.83
        attribution_format:
          type: string
          example: 'Source: {title} by {author}, MedInsight, {publication_date}. {url}'
          description: 'Required attribution format from the RSL license document.

            Variables in {braces} are substituted from asset metadata.

            Agents must use this format when citation=1 and resdis=1.

            '
        processing_time_ms:
          type: integer
          example: 145
    X402PaymentRequired:
      type: object
      description: "HTTP 402 response body generated by AWS WAF (PhantomEdge MonetizationConfig)\nat the CloudFront edge.\
        \ The origin never generates this response.\n\nOn receiving this, the agent should:\n  1. Optionally fetch licenseurl\
        \ from extra field to confirm terms\n  2. Sign payment authorization using AgentCore Payments SDK or wallet API\n\
        \  3. Resubmit the original request with X-PAYMENT header\n"
      required:
      - x402Version
      - error
      - accepts
      properties:
        x402Version:
          type: integer
          example: 2
        error:
          type: string
          example: Payment required to access this content
        resource:
          type: object
          properties:
            url:
              type: string
              format: uri
            description:
              type: string
            mimeType:
              type: string
        accepts:
          type: array
          items:
            type: object
            properties:
              scheme:
                type: string
                example: exact
              network:
                type: string
                example: eip155:8453
                description: 'CAIP-2 network. eip155:8453=Base mainnet, eip155:84532=Base Sepolia,

                  solana mainnet, solana devnet

                  '
              amount:
                type: string
                example: '1000'
                description: Atomic token units. 1000 = /bin/zsh.001 USDC (6 decimal places)
              asset:
                type: string
                example: '0x036CbD53842c5426634e7929541eC2318f3dCF7e'
                description: USDC token contract address
              payTo:
                type: string
                example: '0x209693Bc6afc0C5328bA36FaF03C514EF312287C'
                description: Publisher wallet address. Funds settle directly here.
              maxTimeoutSeconds:
                type: integer
                example: 60
              extra:
                type: object
                description: Metadata injected by PhantomEdge
                properties:
                  name:
                    type: string
                    example: USDC
                  version:
                    type: string
                    example: '2'
                  licenseUrl:
                    type: string
                    format: uri
                    description: RSL license URL. Injected via CloudFront Response Header Policy.
                  agentcore_quickstart:
                    type: string
                    description: Link to AgentCore Payments quickstart
    DiscoverySimilarityThreshold:
      type: number
      minimum: 0
      maximum: 1
      description: Finite inclusive cutoff on the existing response-relative score, not calibrated confidence. Requires explicit query text. Omission applies no cutoff and does not change hybrid retrieval.
    StandardQueryRequest:
      type: object
      description: Standard OpenSearch discovery request. Use content_type and max_results; legacy content_types and limit are rejected, including when canonical fields are also supplied.
      required:
      - query
      not:
        anyOf:
        - required:
          - content_types
        - required:
          - limit
      properties:
        query:
          type: string
          example: AI cancer detection accuracy
        content_type:
          type: array
          items:
            type: string
          example:
          - article
        iab_categories:
          type: array
          items:
            type: integer
          example:
          - 111
          - 126
        max_results:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        similarity_threshold:
          $ref: '#/components/schemas/DiscoverySimilarityThreshold'
        format:
          type: string
          enum:
          - json
          - markdown
          - summary
          default: json
    StandardQueryResponse:
      type: object
      description: Standard (non-CoMP) query response.
      properties:
        query_id:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/StandardQueryResult'
        total_results:
          type: integer
        processing_time_ms:
          type: integer
    StandardQueryResult:
      type: object
      description: 'One standard `/query` result. `url` is always present: a protected read reference

        the caller follows with the credential that admitted the query. On the partner plane it is

        `GET /content?url=` for content with a canonical URL and `GET /content?content_id=` otherwise;

        on the internal (Cognito) plane it is `GET /content/{content_id}`. Inline `content` is optional

        additional data and never replaces `url`.'
      required:
      - content_id
      - url
      additionalProperties: true
      properties:
        content_id:
          type: string
          example: cnt_a1b2c3d4e5f6
        url:
          type: string
          format: uri
          example: https://api.example.com/v1/content?content_id=cnt_a1b2c3d4e5f6
        canonical_url:
          type: string
          format: uri
          nullable: true
          description: The content's canonical public URL, when it has one.
        content:
          type: string
          description: Inline body for short items (under 1,000 characters).
        title:
          type: string
        content_type:
          type: string
        similarity_score:
          type: number
    ContentReadResponse:
      type: object
      description: One document from a single-document `GET /content` read (`url` or `content_id`).
      required:
      - content_id
      - markdown
      - metadata
      properties:
        content_id:
          type: string
          example: cnt_a1b2c3d4e5f6
        markdown:
          type: string
          description: The document's Markdown. For pipeline-ingested content this is the stored
            deterministic Markdown document (see `markdown_schema_version`), the same bytes native edge
            delivery serves.
        metadata:
          type: object
          additionalProperties: true
          properties:
            title:
              type: string
            author:
              type: string
            publisher:
              type: string
              description: The publisher's or site's name, or an empty string when unknown.
            pubdate:
              type: string
            modified_date:
              type: string
              description: When the article itself was last updated, as published in its source, or an
                empty string when unknown. `update` is when the record was last written.
            update:
              type: string
            wordcount:
              type: integer
            language:
              type: string
            sourcetype:
              type: integer
        canonical_url:
          type: string
          description: The canonical URL, or an empty string when the content has none.
    CompError:
      type: object
      required:
      - error
      - code
      properties:
        error:
          type: string
          example: 'CoMP: Declared function ai-train is prohibited under license lic_default_v1'
        code:
          type: integer
          example: 403
        license_url:
          type: string
          format: uri
          description: Link to the RSL license document for reference (when applicable)
        request_id:
          type: string
    ContentMetadataResponse:
      type: object
      description: Contextual metadata for a content item. Served by the Contextual Metadata API (GET /content/{content_id}/metadata).
        Populated by the GEO enrichment pipeline. Serves AI agents (content context) and DSPs/SSPs (contextual ad targeting
        signals).
      properties:
        content_id:
          type: string
          example: cnt_a1b2c3d4
        title:
          type: string
          example: New AI System Achieves 95% Accuracy in Early Cancer Detection
        canonical_url:
          type: string
          format: uri
          example: https://publisher.com/articles/ai-cancer-detection
        markdown_schema_version:
          $ref: '#/components/schemas/MarkdownSchemaVersion'
        publication_date:
          type: string
          format: date-time
        author:
          type: string
          example: Dr. Sarah Johnson
        iab_categories:
          type: array
          description: IAB Content Taxonomy 3.1 categories. Cattax=9 per CoMP spec.
          items:
            type: object
            properties:
              id:
                type: integer
                example: 111
              name:
                type: string
                example: Medical Health
              tier:
                type: integer
                example: 1
        cms_tags:
          type: array
          description: Native CMS tags from WordPress or other CMS export. Customer-defined categories that flow through from
            the source system alongside IAB taxonomy.
          items:
            type: string
          example:
          - oncology
          - clinical-trials
          - diagnostic-AI
        custom_metadata:
          type: object
          description: Extensible key-value pairs. Publishers can add custom categorization beyond IAB taxonomy and CMS tags.
            Structure is customer-defined.
          additionalProperties: true
          example:
            reading_level: technical
            paywall_tier: premium
            content_vertical: health-tech
        entities:
          type: array
          description: Named entities extracted by the GEO enrichment pipeline. Useful for brand safety and contextual targeting
            signals.
          items:
            type: object
            properties:
              type:
                type: string
                example: organization
                enum:
                - organization
                - person
                - location
                - product
                - date
                - metric
                - publication
              value:
                type: string
                example: Stanford Medical Center
        sourcetype:
          type: integer
          description: CoMP creation source. 0=Human, 1=AI, 2=Hybrid
          enum:
          - 0
          - 1
          - 2
          example: 0
        provenance:
          type: integer
          description: Provenance available? 0=No, 1=Yes
          enum:
          - 0
          - 1
          example: 1
        provent:
          type: string
          description: Canonical domain of provenance entity. Required if provenance=1.
          example: c2pa.org
        license_id:
          type: string
          example: lic_standard_inference_v1
        license_url:
          type: string
          format: uri
          example: https://api.publisher.com/ai-content-monetization/v1/licenses/lic_standard_inference_v1
        word_count:
          type: integer
          example: 1200
        language:
          type: string
          example: en
        retrieved_at:
          type: string
          format: date-time
    LicensePricingTier:
      type: object
      required:
      - tier_id
      - tier_name
      - price_per_request
      - currency
      properties:
        tier_id:
          type: string
