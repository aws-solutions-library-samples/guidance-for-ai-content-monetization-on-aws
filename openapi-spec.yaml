          type: string
          example: cnt_abc123
          description: Unique content identifier
        title:
          type: string
          example: Revolutionary AI Breakthrough in Healthcare
          description: Content title
        content_type:
          type: string
          example: article
          description: Type of content
        markdown_schema_version:
          $ref: '#/components/schemas/MarkdownSchemaVersion'
        canonical_url:
          type: string
          format: uri
          description: Normalized canonical source URL when available
        url_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the normalized canonical URL; the #14 resolver GSI is not part of this issue
        edge_eligible:
          type: boolean
          description: Whether the content has a deterministic native-edge object address
        edge_ineligible_reason:
          type: string
          description: Reason native-edge addressing is unavailable
        md_s3_key:
          type: string
          pattern: ^(content|comparison)/
          description: Private S3 Markdown object key. `content/` keys are served by the shared content
            edge; `comparison/` keys belong to comparison-run records (status `comparison`), which no edge
            behavior or partner read serves.
        status:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
          - published
          - deleting
          - comparison
          example: published
          description: Record status. Only `published` content is served to partners. `deleting` means a
            delete was accepted and is still completing; the record disappears once it finishes.
            `comparison` marks a scrape-vs-Markdown comparison run's record (internal only, never served,
            expires).
