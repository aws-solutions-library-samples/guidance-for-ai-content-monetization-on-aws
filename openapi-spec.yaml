        contact_name:
          type: string
          nullable: true
        contact_email:
          type: string
          format: email
          nullable: true
        pricing_tier:
          $ref: '#/components/schemas/PartnerPricingTier'
        status:
          $ref: '#/components/schemas/PartnerStatus'
        allowed_endpoints:
          $ref: '#/components/schemas/PartnerAllowedEndpoints'
        identity_source:
          $ref: '#/components/schemas/PartnerIdentitySource'
        marketplace_type:
          type: string
          nullable: true
        marketplace_customer_id:
          type: string
          nullable: true
        active_key_count:
          type: integer
          description: Number of enabled API keys bound to this partner
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    PartnersListResponse:
