openapi: 3.0.3
info:
  title: Guidance for AI Content Monetization on AWS
  description: Complete API specification for the AI Content Monetization. Implements IAB CoMP v1.0 (Content Monetization
    Protocols), RSL (Real Simple Licensing), and x402 payment documentation for CloudFront WAF AI Content Monetization.
  version: 2.0.0
servers:
- url: https://api.publisher.com/ai-content-monetization/v1
  description: Production server
- url: https://staging-api.publisher.com/ai-content-monetization/v1
  description: Staging server
security:
- PartnerKeyAuth: []
- CognitoAuth: []
x-cors:
  description: 'CORS is enabled on all API Gateway endpoints. Browser clients may issue preflight OPTIONS requests; responses
    include the Access-Control-Allow-Origin, Access-Control-Allow-Methods, and Access-Control-Allow-Headers headers.

    '
  preflightMethod: OPTIONS
  allowOriginHeader: Access-Control-Allow-Origin
x-error-codes:
  description: 'Stable machine-readable `error_code` values emitted on the partner plane. Entries with
    `source: gateway` are produced by API Gateway gateway responses before any handler runs; entries with
    `source: handler` by the handler. All bodies use the `Error` schema.'
  codes:
  - error_code: invalid_api_key
    status: '403'
    source: gateway
    description: The x-api-key header is missing, unknown, or belongs to a disabled key.
  - error_code: quota_exceeded
    status: '429'
    source: gateway
    description: The key''s usage plan monthly quota is exhausted. `Retry-After` is set.
  - error_code: throttled
    status: '429'
    source: gateway
    description: The key''s usage plan rate or burst limit was hit. `Retry-After` is set.
  - error_code: request_blocked
    status: '403'
    source: gateway
    description: AWS WAF blocked the request before it reached the API.
  - error_code: access_denied
    status: '403'
    source: gateway
    description: API Gateway denied the request (for example, a resource policy) before any handler ran.
  - error_code: unauthorized
    status: '401'
    source: gateway
    description: Internal (Cognito) plane only. The request carried no Authorization bearer token, or
      the token was malformed or not issued by the configured user pool, so API Gateway rejected it
      before any handler ran. The portal treats this as an expired session and asks the user to sign
      in again. Emitted with CORS headers so a browser can read the status instead of a network error.
  - error_code: token_expired
    status: '403'
    source: gateway
    description: Internal (Cognito) plane only. The bearer token was valid but has expired. Refresh the
      session or sign in again. Emitted with CORS headers so a browser can read the status.
  - error_code: route_not_found
    status: '403'
    source: gateway
    description: No such path or method on the partner API. API Gateway keeps its default 403 for this
      case; the code tells it apart from a key rejection.
  - error_code: request_rejected
    status: '4XX'
    source: gateway
    description: Any other request API Gateway rejected before a handler ran (for example, an oversized
      body). The status is the gateway's; `error` carries its message.
  - error_code: gateway_error
    status: '5XX'
    source: gateway
    description: API Gateway failed to complete the request (for example, an integration timeout). Safe
      to retry with backoff.
  - error_code: partner_inactive
    status: '403'
    source: handler
    description: The key resolved to a partner whose status is not `active`, or to no partner at all.
  - error_code: endpoint_not_allowed
    status: '403'
    source: handler
    description: The partner''s `allowed_endpoints` does not include this operation.
  - error_code: invalid_read_selector
    status: '400'
    source: handler
    description: A single-document `GET /content` read needs exactly one of `url` and `content_id`, and
      `content_id` must match `^[A-Za-z0-9_-]{1,128}$`. Neither, both, or a malformed `content_id` was
      supplied.
  - error_code: content_not_found
    status: '404'
    source: handler
    description: A single-document `GET /content` read found no published content for the `url` or
      `content_id`. Unknown, unpublished and failed records all answer this, so a response never
      reveals whether a record exists.
  - error_code: authentication_required
    status: '401'
    source: handler
    description: The request carried no credential the handler could resolve (no Cognito identity, no
      valid JWT, and no partner key bound to the request). A key created moments ago can return this
      while API Gateway propagates it; retry after a short wait.
paths:
  /content:
    post:
      summary: Ingest Content
      description: 'Upload and ingest new content (articles, documents, media) for processing and indexing.

        Supports multimodal content with text, images, and metadata. Content is automatically

        processed using Amazon Bedrock Titan embeddings for vector search capabilities.

        Accessible only through publisher dashboard with Cognito authentication.'
      operationId: ingestContent
      security:
      - CognitoAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContentIngestionRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ContentIngestionRequestJSON'
      responses:
        '202':
          description: Content accepted and queued for GEO enrichment (asynchronous processing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentIngestionResponse'
        '400':
          description: Invalid content or metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or missing publisher key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Content too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Ingest
      x-audience: internal
    get:
      summary: List Content
      description: 'Retrieve a list of ingested content with filtering and pagination.

        Accessible only through publisher dashboard with Cognito authentication.


        On the partner plane this operation reads a single document instead: supply exactly one of

        `url` (the canonical URL) or `content_id` (for content without a canonical URL). Both forms

        return the same `ContentReadResponse` representation, `ETag`, `304 Not Modified` behaviour and

        billing; a `304` is not a billable access. `POST /query` results link to these reads.


        On the internal plane a Cognito caller may read a single document the same way, with the

        same representation, `ETag` and `304`. That read is the publisher''s own access and is not

        billed.'
      operationId: listContentOrGetByUrl
      security:
      - CognitoAuth: []
      - PartnerKeyAuth: []
      parameters:
      - name: url
        in: query
        description: 'Canonical URL of the content to retrieve (URL-addressable retrieval).
          When supplied, the operation returns the single matching document instead of a list.

          Normalized before lookup: the scheme and host are lower-cased, any query string
          and fragment are dropped, and a trailing slash is tolerated - a URL cited with or
          without one resolves to the same document. The scheme is NOT interchangeable: an
          http:// citation does not resolve content published over https://.

          Only published content is returned. A record at the URL that is not published gets
          the same `404` as an unknown URL.'
        schema:
          type: string
          format: uri
        example: https://example.com/article
      - name: content_id
        in: query
        description: 'Content identifier of a published document to read (single-document read by

          identifier). Mutually exclusive with `url`. Unknown, unpublished and failed records all

          return the same `404`, so the response never reveals whether an identifier exists.'
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
        example: cnt_a1b2c3d4e5f6
      - name: If-None-Match
        in: header
        description: ETag value for a conditional request; returns 304 when the content is
          unchanged. Single-document reads only (`url` or `content_id`).
        schema:
          type: string
        example: '"abc123def456"'
      - name: status
        in: query
        description: Filter by record status. `published` is the status of servable content; `deleting`
          marks a record whose delete is still completing; `comparison` marks a short-lived record a
          comparison run produced. With no `status`, the list leaves comparison records out; pass
          `status=comparison` to list them.
        schema:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
          - published
          - deleting
          - comparison
      - name: content_type
        in: query
        description: Filter by content type
        schema:
          type: string
      - name: iab_category
        in: query
        description: Filter by IAB category ID
        schema:
          type: integer
      - name: limit
        in: query
        description: Number of items to return
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: next_token
        in: query
        description: Token for pagination (DynamoDB-compatible)
        schema:
          type: string
          description: Base64-encoded pagination token from previous response
      - name: search
        in: query
        description: Search content by title or text
        schema:
          type: string
      responses:
        '200':
          description: A list of content items, or one document for a single-document read
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ContentListResponse'
                - $ref: '#/components/schemas/ContentReadResponse'
        '304':
          description: Not Modified - the content is unchanged since the If-None-Match ETag
            (single-document reads only). Carries no body and is NOT a billable access.
        '404':
          description: No published content for the specified `url` or `content_id`
            (`application/json`, `error_code` `content_not_found`). A moved URL answers RFC 9457
            Problem Details (`application/problem+json`) carrying redirectUrl.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid query parameter (e.g. a non-integer limit), or `invalid_read_selector`
            on a single-document read. See `x-error-codes`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The document could not be returned, for example because its stored Markdown is
            unavailable or too large to return. Not billed. The body never names the storage location.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Content Access
      x-audience: partner
  /content/{content_id}:
    get:
      summary: Get Content Details
      description: 'Retrieve detailed information about a specific content item.

        Accessible only through publisher dashboard with Cognito authentication.'
      operationId: getContent
      security:
      - CognitoAuth: []
      parameters:
      - name: content_id
        in: path
        required: true
        description: Unique content identifier
        schema:
          type: string
      responses:
        '200':
          description: Content details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentDetails'
        '404':
          description: Content not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Ingest
      x-audience: internal
    put:
      summary: Update Content
      description: 'Update content metadata, IAB categories, or reprocess content.

        Accessible only through publisher dashboard with Cognito authentication.'
      operationId: updateContent
      security:
      - CognitoAuth: []
      parameters:
      - name: content_id
        in: path
        required: true
        description: Unique content identifier
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentUpdateRequest'
      responses:
        '200':
          description: Content updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentDetails'
        '404':
          description: Content not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The content is being deleted (`status` is `deleting`), so it can't be updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Ingest
      x-audience: internal
    delete:
      summary: Delete Content
      description: 'Delete content and everything stored for it: the record, its stored Markdown and

        source objects, its embedding, its processing jobs and its search document.


        The delete is accepted at once and completes asynchronously. From the moment it is accepted, the

        partner reads return `404` and the record''s `status` is `deleting`; the dashboard keeps listing it

        with that status until the delete completes, usually within seconds. For that short window the

        document can still appear in `POST /query` results, and its read references return `404`.


        Deleting a record that is already `deleting` is accepted again and retries the cleanup.


        Accessible only through publisher dashboard with Cognito authentication.'
      operationId: deleteContent
      security:
      - CognitoAuth: []
      parameters:
      - name: content_id
        in: path
        required: true
        description: Unique content identifier
        schema:
          type: string
      responses:
        '202':
          description: Delete accepted. It completes asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentDeleteAccepted'
        '404':
          description: Content not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Ingest
      x-audience: internal
  /content/{content_id}/reprocess:
    post:
      summary: Reprocess Content
      description: 'Trigger reprocessing of content for embeddings, image analysis, or IAB categorization.

        Useful when updating processing models or fixing categorization issues.

        Accessible only through publisher dashboard with Cognito authentication.'
      operationId: reprocessContent
      security:
      - CognitoAuth: []
      parameters:
      - name: content_id
        in: path
        required: true
        description: Unique content identifier
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReprocessRequest'
      responses:
        '202':
          description: Reprocessing queued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReprocessResponse'
        '404':
          description: Content not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The content is being deleted (`status` is `deleting`), so it can't be reprocessed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Ingest
      x-audience: internal
  /content/bulk:
    post:
      summary: Bulk Content Operations
      description: 'Perform bulk operations on multiple content items.

        Accessible only through publisher dashboard with Cognito authentication.'
      operationId: bulkContentOperations
      security:
      - CognitoAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkOperationRequest'
      responses:
        '202':
          description: Bulk operation queued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResponse'
      tags:
      - Ingest
      x-audience: internal
  /processing/status:
    get:
      summary: Processing Status
      description: 'Get status of content processing pipelines and AI/ML jobs.

        Accessible only through publisher dashboard with Cognito authentication.'
      operationId: getProcessingStatus
      security:
      - CognitoAuth: []
      responses:
        '200':
          description: Processing status information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingStatus'
      tags:
      - Enrich
      x-audience: internal
  /info:
    get:
      summary: Discovery Endpoint (Partner-Only)
      description: 'Retrieve metadata about the API, including pricing, content types, and access rules.

        This endpoint supports optional authentication - public access provides basic info,

        authenticated access provides enhanced partner-specific information.'
      operationId: getApiInfo
      security:
      - PartnerKeyAuth: []
      - {}
      responses:
        '200':
          description: Successful response with API metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInfo'
      tags:
      - Discovery
      x-audience: partner
  /query:
    post:
      summary: Query Endpoint (Hybrid Authentication)
      description: "Submit a content query (hybrid authentication) in either standard format or CoMP v1.0 AISystem format.\n\
        \nRequest format is detected automatically:\n  - If body contains \"aisystem\" key \u2192 CoMP v1.0 flow\n  - Otherwise\
        \ \u2192 standard query flow (unchanged)\n\nCoMP flow:\n  1. Validates aisysuse.lid against RSL license at /licenses/{lid}\n\
        \  2. Checks declared function/subfn are permitted under the license\n  3. Translates AISystem request to internal\
        \ search parameters\n  4. Executes search and returns CoMP Package response\n\nAuthentication: Partner Key (for AI agents) or Cognito JWT (for publisher UI).\nPayment:\
        \ Handled by AWS WAF (PhantomEdge) at CloudFront edge before this\nendpoint is reached. Origin never processes payments."
      operationId: queryContent
      security:
      - PartnerKeyAuth: []
      - CognitoAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/CompAISystemRequest'
              - $ref: '#/components/schemas/StandardQueryRequest'
            examples:
              comp_inference:
                summary: "CoMP v1.0 \u2014 RAG/inference request"
                value:
                  aisystem:
                    name: medical-ai-assistant.com
                    ua: MedBot/1.0
                    id: TL-REG-334455
                    aisysuse:
                      lid: lic_medinsight_inference_v1
                      aiauth: 2
                      uri:
                      - https://medinsight.com/oncology
                      scope: 1
                      function:
                      - 3
                      subfn:
                      - 1
                      resdis: 1
              comp_training:
                summary: "CoMP v1.0 \u2014 Training data request"
                value:
                  aisystem:
                    name: model-trainer.ai
                    id: TL-REG-778899
                    aisysuse:
                      lid: lic_medinsight_training_v1
                      aiauth: 2
                      scope: 0
                      function:
                      - 2
                      subfn:
                      - 0
                      resdis: 0
              standard:
                summary: Standard query format (unchanged)
                value:
                  query: AI cancer detection accuracy
                  content_type:
                  - article
                  iab_categories:
                  - 111
                  max_results: 10
      responses:
        '200':
          description: "Query successful.\nResponse format mirrors request format:\n  - CoMP AISystem request \u2192 CompPackageResponse\n\
            \  - Standard request \u2192 StandardQueryResponse\n"
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/CompPackageResponse'
                - $ref: '#/components/schemas/StandardQueryResponse'
        '400':
          description: "Invalid request \u2014 missing required CoMP fields or malformed body"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompError'
        '401':
          description: Invalid or missing authentication (`authentication_required`). See `x-error-codes`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: "Payment required \u2014 returned by AWS WAF (PhantomEdge) at the CloudFront\nedge before this endpoint\
            \ is reached. Origin never generates 402.\nSee X402PaymentRequired schema for response body structure.\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/X402PaymentRequired'
        '403':
          description: "License compliance violation \u2014 declared function/subfn is not permitted\nunder the specified\
            \ license_id. Check allowed_uses in the RSL document\nat the licenseurl.\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompError'
        '404':
          description: "License ID not found \u2014 check /licenses for available licenses"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompError'
        '500':
          description: Unexpected internal discovery failure. No retry hint is supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: An expected OpenSearch or embedding SDK failure prevented discovery.
          headers:
            Retry-After:
              description: Seconds to wait before retrying discovery.
              schema:
                type: integer
                example: 3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Content Access
      x-audience: partner
  /taxonomy:
    get:
      summary: IAB Content Taxonomy Endpoint (Partner-Only)
      description: 'Retrieve the complete IAB Content Taxonomy 3.1 structure supported by this publisher.

        This endpoint helps AI operators understand available content categories and their hierarchical structure.

        Public access provides basic taxonomy, authenticated access includes usage statistics.'
      operationId: getIABTaxonomy
      security:
      - PartnerKeyAuth: []
      - {}
      parameters:
      - name: tier_level
        in: query
        description: Filter by specific tier level (1=top level, 4=most specific)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 4
      - name: parent_id
        in: query
        description: Get categories under a specific parent category
        required: false
        schema:
          type: string
      - name: search
        in: query
        description: Search categories by name
        required: false
        schema:
          type: string
      responses:
        '200':
          description: IAB Content Taxonomy data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IABTaxonomyResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Discovery
      x-audience: partner
  /log:
    post:
      summary: Logging Endpoint (Partner-Only)
      description: 'Submit query logs for analytics and verification (optional, per brand requirements).

        This endpoint is for partner usage logging in pre-pay billing model.

        Internal usage tracking is handled separately.'
      operationId: submitLog
      security:
      - PartnerKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogRequest'
      responses:
        '200':
          description: Log accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogResponse'
        '400':
          description: Invalid log data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Rejected before the handler by API Gateway (`invalid_api_key`) or by the handler after
            partner resolution (`partner_inactive`, `endpoint_not_allowed`). See `x-error-codes`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Usage plan quota or rate limit exceeded (`quota_exceeded`, `throttled`); `Retry-After` is set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Usage Reporting
      x-audience: partner
  /analytics/metrics:
    get:
      summary: Analytics Metrics
      description: 'Retrieve analytics metrics for content performance and usage.

        Accessible only through publisher dashboard with Cognito authentication.'
      operationId: getAnalyticsMetrics
      security:
      - CognitoAuth: []
      parameters:
      - name: time_period
        in: query
        description: Time period for metrics (last_7_days, last_30_days, last_90_days)
        schema:
          type: string
          enum:
          - last_7_days
          - last_30_days
          - last_90_days
          default: last_30_days
      - name: metric_type
        in: query
        description: Type of metrics to retrieve
        schema:
          type: string
          enum:
          - api_requests
          - content_access
          - revenue
          - bot_activity
      responses:
        '200':
          description: Analytics metrics data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsMetrics'
      tags:
      - Measure
      x-audience: internal
  /analytics/usage:
    get:
      summary: Usage Analytics
      description: 'Retrieve detailed usage analytics including access patterns and trends.

        Accessible only through publisher dashboard with Cognito authentication.'
      operationId: getUsageAnalytics
      security:
      - CognitoAuth: []
      parameters:
      - name: date_range
        in: query
        description: Date range for analytics (last_7_days, last_30_days, custom:YYYY-MM-DD:YYYY-MM-DD)
        schema:
          type: string
          default: last_7_days
      - name: content_type
        in: query
        description: Filter by content type
        schema:
          type: string
      - name: bot_filter
        in: query
        description: Filter by specific bot or partner
        schema:
          type: string
      responses:
        '200':
          description: Usage analytics data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageAnalytics'
      tags:
      - Measure
      x-audience: internal
  /analytics/revenue:
    get:
      summary: Revenue Metrics
      description: 'Retrieve revenue metrics and monetization data.

        Accessible only through publisher dashboard with Cognito authentication.'
      operationId: getRevenueMetrics
      security:
      - CognitoAuth: []
      parameters:
      - name: time_period
        in: query
        description: Time period for revenue analysis
        schema:
          type: string
          enum:
          - last_7_days
          - last_30_days
          - last_90_days
          default: last_30_days
      - name: breakdown_by
        in: query
        description: How to break down revenue data
        schema:
          type: string
          enum:
          - content_type
          - bot_partner
          - geographic
          default: content_type
      responses:
