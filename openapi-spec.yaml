                $ref: '#/components/schemas/Error'
      x-audience: internal
    post:
      summary: Create License Document
      description: 'Create a new RSL license document. The created license is assigned a stable public URL (/licenses/{license_id})
        referenced as licenseUrl in CoMP Package responses, content metadata, and the x402 extra field.

