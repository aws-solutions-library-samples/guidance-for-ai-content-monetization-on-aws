          example: AgentCore Runtime
    ContentItem:
      type: object
      required:
      - content_id
      - title
      - content_type
      - status
      properties:
        content_id:
          type: string
          description: Unique content identifier
        title:
          type: string
          description: Content title
        description:
          type: string
          description: Content description
        content_type:
          type: string
          description: Type of content
        markdown_schema_version:
          $ref: '#/components/schemas/MarkdownSchemaVersion'
        canonical_url:
          type: string
          format: uri
          description: Normalized canonical source URL when available
        url_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the normalized canonical URL
        edge_eligible:
          type: boolean
          description: Whether the content has a deterministic native-edge object address
        edge_ineligible_reason:
          type: string
        md_s3_key:
          type: string
          pattern: ^(content|comparison)/
          description: Private S3 Markdown object key. `content/` keys are served by the shared content
            edge; `comparison/` keys belong to comparison-run records (status `comparison`), which no edge
            behavior or partner read serves.
        status:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
          - published
          - deleting
          - comparison
          example: published
          description: Record status, the same field the list (`ContentSummary`) returns. Only `published`
            content is served to partners. `deleting` means a delete was accepted and is still completing.
            `comparison` marks a scrape-vs-Markdown comparison run's record (internal only, never served,
            expires). (Was documented as the processing status; the handler returns the record status.)
        iab_categories:
          type: array
          items:
            $ref: '#/components/schemas/IABContentCategory'
          description: IAB content categories (standardized format)
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        file_path:
          type: string
          description: File storage path
        file_size:
          type: integer
          description: File size in bytes
        embedding_info:
          type: object
          description: Embedding information (standardized field name)
          properties:
            model:
              type: string
              description: Embedding model used
            dimensions:
              type: integer
              description: Embedding dimensions
            status:
              type: string
              enum:
              - pending
              - completed
              - failed
        access_count:
          type: integer
          description: Number of times content has been accessed
        revenue_generated:
          type: number
          format: float
          description: Revenue generated from this content
        last_accessed:
          type: string
          format: date-time
          description: Last access timestamp
    MarkdownSchemaVersion:
      type: string
      enum:
      - '1.1'
      - '1.0'
      - legacy
      example: '1.1'
      description: Deterministic Markdown convention used for the content rendition. `1.1` adds a metadata block (author,
        publisher, published and updated dates, source) under the title, a generated summary, a generated FAQ section
        and an attribution line. Records keep the version they were written with until they are reprocessed; records
        created before versioning return `legacy`.
    ContentDetails:
      allOf:
      - $ref: '#/components/schemas/ContentItem'
      - type: object
        properties:
          content_text:
            type: string
            description: Full content text. For pipeline-ingested content this is the stored
              deterministic Markdown document (see `markdown_schema_version`); it is empty when that
              document can't be read or is too large to return, so the record's details stay available.
          publisher:
            type: string
            description: The publisher's or site's name, or an empty string when unknown.
          modified_date:
            type: string
            description: When the article itself was last updated, as published in its source, or an
              empty string when unknown. `updated_at` is when the record was last written.
          metadata:
            type: object
            additionalProperties: true
            description: Additional content metadata
          processing_history:
            type: array
            items:
              type: object
              properties:
                timestamp:
                  type: string
                  format: date-time
                status:
                  type: string
                details:
                  type: string
            description: Processing history log
    PricingRulesResponse:
      type: object
      description: "Response containing the publisher's active pricing rules. IAB category multipliers are resolved server-side\
        \ to human-readable names (via TaxonomyManager) and returned in the required ``iab_category_resolved`` map \u2014\
        \ every consumer (UI, agent tools) gets self-describing categories without a second call.\n"
      required:
      - status
      - pricing_rule
      properties:
        status:
          type: string
        rule_set_id:
          type: string
        pricing_rule:
          type: object
          description: The active pricing rule version.
          properties:
            rule_set_id:
              type: string
            version_timestamp:
              type: string
            effective_date:
              type: string
            status:
              type: string
            pricing_rules:
              type: object
              properties:
                multipliers:
                  type: object
                  properties:
                    iab_category:
                      type: object
                      additionalProperties:
                        type: number
                      description: Raw category-ID -> multiplier map (preserved for compatibility).
                    iab_category_resolved:
                      type: object
                      description: 'REQUIRED server-side resolution of iab_category: each category ID mapped to its multiplier
                        plus resolved name/full_path/tier_level.

                        '
                      additionalProperties:
                        type: object
                        required:
                        - multiplier
                        - category_name
                        - full_path
                        - tier_level
                        properties:
                          multiplier:
                            type: number
                          category_name:
                            type: string
                          full_path:
                            type: string
                          tier_level:
                            type: integer
                  required:
                  - iab_category_resolved
        publisher_id:
          type: string
        resolved_at:
          type: string
          format: date-time
        timestamp:
          type: string
          format: date-time
    PricingHistoryResponse:
      type: object
      description: Historical pricing changes for the publisher.
      properties:
        history:
          type: array
          items:
            type: object
        publisher_id:
          type: string
        timestamp:
          type: string
          format: date-time
    PricingCalculationRequest:
      type: object
      description: Request to calculate a price for given content/usage parameters.
      properties:
        content_id:
          type: string
        usage_type:
          type: string
        quantity:
          type: integer
    PricingCalculationResponse:
      type: object
      description: Calculated price result for the requested content/usage.
      properties:
        amount:
          type: number
          format: float
        currency:
          type: string
        breakdown:
          type: object
    CreatePricingRulesRequest:
      type: object
      description: Request body to create one or more pricing rules.
      properties:
        rules:
          type: array
          items:
            type: object
    UpdatePricingRulesRequest:
      type: object
      description: Request body to update one or more pricing rules.
      properties:
        rules:
          type: array
          items:
            type: object
    PartnerPricingTier:
      type: string
      description: Pricing tier. Each tier is backed by one API Gateway usage plan that carries the monthly
        quota and throttle limits; quota is not configurable per partner.
      enum:
      - basic
      - standard
      - premium
      - enterprise
    PartnerStatus:
      type: string
      description: '`suspended` disables every key and is reversible; `deleted` is set only by DELETE and keeps
        the record as a referent for usage history.'
      enum:
      - active
      - suspended
      - deleted
    PartnerAllowedEndpoints:
      type: array
      description: Closed set of key-gated partner-plane operations the partner may call. Values are
        `operationId`s from this document. Enforced by the handler after partner resolution
        (`403 endpoint_not_allowed`). An empty or omitted array is intentionally open and allows EVERY
        key-gated operation (`queryContent`, `submitLog`, `validateLicense`); the edge still requires a valid
        key and the partner's tier still applies. List operations explicitly to restrict a partner.
      items:
        type: string
        enum:
        - queryContent
        - submitLog
        - validateLicense
    PartnerIdentitySource:
      type: string
      description: '`direct` partners authenticate with an API key issued here; `marketplace` partners are
        identified by an external marketplace and have no key.'
      enum:
      - direct
      - marketplace
    Partner:
      type: object
      description: A registered partner (licensee) record.
      required:
      - partner_id
      - partner_name
      - pricing_tier
      - status
      - identity_source
