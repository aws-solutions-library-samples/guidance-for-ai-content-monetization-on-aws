            type: string
        dur:
          type: array
          description: Duration in seconds
          items:
            type: integer
        wordcount:
          type: array
          description: Word count of the audio transcript
          items:
            type: integer
        transcript:
          type: integer
          description: Transcript available? 0=No, 1=Yes
          enum:
          - 0
