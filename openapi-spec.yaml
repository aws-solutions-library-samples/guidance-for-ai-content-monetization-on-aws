  /test/comparison-runs:
    post:
      summary: Start a scrape-vs-licensed-Markdown comparison run
      description: 'Fetch one publisher article page server-side behind an SSRF guard, measure the
        scrape path (document and same-origin subresource sizes, request count, time), and queue the
        page for GEO enrichment by writing it under ingest/comparison/. Returns the measured scrape
        side and the document body at once; the licensed-Markdown side is obtained by polling
        GET /test/comparison-runs/{run_id} until the pipeline has published the article.

        A run never creates or changes a catalogue record. When the page is on one of the
        deployment''s publisher hosts (origin "owned") and its article is already published, the
        run reuses that record (ingest "reused") and writes nothing. Every other run (an external
        page, an owned article not yet ingested, or reingest true) is ingested into the comparison
        partition: a record with status "comparison" and a Markdown object outside content/, which
        no partner read, discovery or search serves. The run route is a control-plane operation of
        the publisher portal (Test stage); it never serves content to partners.

        Accessible only through the publisher dashboard with Cognito authentication.'
      operationId: createComparisonRun
      security:
      - CognitoAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComparisonRunRequest'
      responses:
        '202':
          description: Scrape side measured; the page is queued (or an existing record is reused)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonRunSubmitted'
        '400':
          description: 'The URL was refused or the page could not be fetched. error_code is one of
            invalid_url, url_not_allowed, url_unresolvable, fetch_failed, fetch_too_large,
            fetch_timeout, fetch_not_html, canonical_ineligible.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'No allow-list is configured and the portal origin could not be resolved, so
            the route refuses to fetch (error_code allow_list_unavailable). Fail closed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Test
      x-audience: internal
  /test/comparison-runs/{run_id}:
    get:
      summary: Poll a comparison run for the licensed-Markdown side
      description: 'Resolve the run''s canonical URL through the url_hash index and, once the record
        is published and newer than the run''s submit time, read the published Markdown object and
        return it with the resolve and fetch timings. A run that is not published yet answers 200
        with status pending, never 404. The run identifier is stateless: it carries the canonical
        URL hash and the submit time.

        Accessible only through the publisher dashboard with Cognito authentication.'
      operationId: getComparisonRun
      security:
      - CognitoAuth: []
      parameters:
      - name: run_id
        in: path
        required: true
        description: '<sha256 hex of the normalised canonical URL>-<submit epoch seconds, or 0 for a reused record>'
        schema:
          type: string
          pattern: ^[0-9a-f]{64}-[0-9]{1,10}$
      responses:
        '200':
          description: Run status, with the licensed-Markdown measurement when ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonRunStatus'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Malformed run identifier (error_code run_not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Test
      x-audience: internal
components:
  securitySchemes:
    PartnerKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: 'Native API Gateway key for external API access. Used by AI agents and bots to access
        content. Obtain at the registration URL provided in the /info endpoint.


        Keys are validated by API Gateway before any handler runs: a missing or invalid key is rejected
        with `403 invalid_api_key`, and per-tier monthly quota and throttling are enforced by the
        usage plan the key is bound to (`429 quota_exceeded` / `429 throttled`, see `x-error-codes`).


        **Usage**: External API access, MCP server requests, bot content queries, usage logging

        **Header**: `x-api-key: <your-api-key>`

        **Endpoints**: /query, /log, /licenses/{license_id}/validate (key required); /info, /taxonomy,
        /llms.txt, /.well-known/comp.json, /licenses/{license_id} (public)

        '
    CognitoAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Cognito JWT token for publisher dashboard access. Obtained through AWS Cognito authentication flow.


        **Usage**: Publisher dashboard, analytics, content management, bot control, pricing configuration

        **Header**: `Authorization: Bearer <jwt-token>`

        **Endpoints**: /analytics/*, /bot-control/*, /content/*, /partners/*, /pricing/*, /processing/status,
        /analytics-agent/chat, /query (internal plane), /licenses/{license_id}/validate (internal plane)

        '
  responses:
    BadRequest:
      description: "Bad request \u2014 malformed request or invalid parameters."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CompError'
    Unauthorized:
      description: Authentication required, or the supplied credentials are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CompError'
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LicenseNotFound:
      description: The requested license document does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CompError'
    LicenseViolation:
      description: The request violates the terms of the applicable license.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CompError'
  schemas:
    ComparisonRunRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          example: https://portal.example.com/fixtures/comparison/article.html
          description: The publisher article page to compare. https only; the host must pass the SSRF guard and, when configured, the allow-list.
        reingest:
          type: boolean
          default: false
          description: Ingest the page into the comparison partition even when an owned, published record exists (to compare fresh pipeline output). Never touches the catalogue record.
    ComparisonArticle:
      type: object
      required:
      - website_url
      - final_url
      - canonical_url
      - canonical_injected
      - markdown_key
      properties:
        website_url:
          type: string
          description: The URL as submitted
        final_url:
          type: string
          description: The URL after redirects (at most 3, each re-validated)
        canonical_url:
          type: string
          description: The normalised canonical URL the pipeline addresses the Markdown by
        canonical_injected:
          type: boolean
          description: True when the page had no rel=canonical link and the route injected final_url before ingest
        canonical_overridden:
          type: boolean
          default: false
          description: True when the page claimed a canonical URL on a host it is not entitled to (an owned page outside the publisher hosts, an external page outside its own host); the claim was removed and final_url used instead
        markdown_key:
          type: string
          example: comparison/0f3c9a…e1.md
          description: The S3 key of the Markdown this run reads. For a reused record, its catalogue key (content/<host>/<path>.md); for a partition ingest, comparison/<url_hash>.md, which no edge behavior serves
        licence_advertised:
          type: string
          nullable: true
          description: The rel=license value of the page's Link response header, or null
    ComparisonScrapeMeasurement:
      type: object
      required:
      - status
      - document_bytes
      - total_bytes
      - requests
      - external_refs
      - document_ms
      - total_ms
      - subresources_probed
      - subresources_skipped
      properties:
        status:
          type: integer
          description: HTTP status of the document fetch
        document_bytes:
          type: integer
          description: Decoded size of the HTML document
        total_bytes:
          type: integer
          description: Document bytes plus Content-Length of the probed same-origin subresources
        requests:
          type: integer
          description: 1 (document) plus the number of same-origin subresources discovered
        external_refs:
          type: integer
          description: Cross-origin subresources counted, never fetched
        document_ms:
          type: integer
          description: Wall-clock time of the document fetch, measured in the run route
        total_ms:
          type: integer
          description: Document fetch plus subresource probes, measured in the run route
        subresources_probed:
          type: integer
        subresources_skipped:
          type: integer
          description: Same-origin subresources not probed (cap, budget or probe failure)
    ComparisonRunSubmitted:
      type: object
      required:
      - run_id
      - submitted_at
      - ingest
      - origin
      - allow_list_mode
      - article
      - scrape
      - html
      properties:
        run_id:
          type: string
          pattern: ^[0-9a-f]{64}-[0-9]{1,10}$
        submitted_at:
          type: string
          format: date-time
        ingest:
          type: string
          enum:
          - submitted
          - reused
          description: submitted = the page was written under ingest/comparison/ and the pipeline will put it in the comparison partition (status comparison, never a catalogue record); reused = an owned, already-published record is used and nothing was written
        origin:
          type: string
          enum:
          - owned
          - external
          description: owned = the page's final URL is on one of the deployment's publisher hosts (COMPARISON_PUBLISHER_HOSTS); external = any other page, and every page when no publisher host is configured
        allow_list_mode:
          type: string
          enum:
          - restricted
          - open
          description: restricted = COMPARISON_ALLOWED_HOSTS is set and was enforced; open = any public host that passes the SSRF guard
        article:
          $ref: '#/components/schemas/ComparisonArticle'
        scrape:
          $ref: '#/components/schemas/ComparisonScrapeMeasurement'
        html:
          type: string
          description: The fetched document (after canonical injection, if any), for the browser-side cleanup steps. Never rendered as HTML by the portal.
    ComparisonApiMeasurement:
      type: object
      required:
      - content_id
      - resolve_ms
      - fetch_ms
      - bytes
      - markdown
      - updated_at
      properties:
        content_id:
          type: string
        resolve_ms:
          type: integer
          description: Time of the url_hash index lookup, measured in the run route
        fetch_ms:
          type: integer
          description: Time to read the published Markdown object, measured in the run route
        bytes:
          type: integer
          description: Decoded size of the Markdown object
        markdown:
          type: string
        etag:
          type: string
          nullable: true
          description: ETag of the Markdown object
        updated_at:
          type: string
          description: The record's updated_at; later than the run's submit time by construction
        provenance:
          type: object
          properties:
            title:
              type: string
              nullable: true
            author:
              type: string
              nullable: true
            pubdate:
              type: string
              nullable: true
            canonical_url:
              type: string
              nullable: true
    ComparisonRunStatus:
      type: object
      required:
      - run_id
      - status
      - elapsed_ms
      properties:
        run_id:
          type: string
        status:
          type: string
          enum:
          - pending
          - ready
          description: pending until the record is published and newer than the submit time
        elapsed_ms:
          type: integer
          description: Milliseconds since the submit time (0 for a reused record)
        api:
          $ref: '#/components/schemas/ComparisonApiMeasurement'
    Connection:
      type: object
      description: 'An activated adapter instance (a Connection). Carries only non-secret config and
        the Secrets Manager reference (``secret_ref``) — never the secret value (integration-adapters
        Req 6.4, 7.2).'
      required:
      - connection_id
      - domain
      - adapter
      properties:
        connection_id:
          type: string
          description: Connection identifier (primary key)
        domain:
          type: string
          description: Integration domain (content / marketplace / telemetry / access)
        adapter:
          type: string
          description: Which built-in adapter this Connection activates
        brand:
          type: string
          nullable: true
          description: Tenant/brand scope; null for single-brand deployments
        config:
          type: object
          additionalProperties: true
          description: Non-secret configuration (endpoints/region/product-code/etc.)
        secret_ref:
          type: string
          description: Secrets Manager ARN/name — never the secret value
        active:
          type: boolean
          description: Activation state
        created_at:
          type: string
          description: ISO 8601 creation timestamp
        updated_at:
          type: string
          description: ISO 8601 last-update timestamp
    ConnectionCreateRequest:
      type: object
      description: 'Activate a Connection. ``secret`` is a write-only field forwarded to Secrets
        Manager; it is never persisted in the record and never returned.'
      required:
      - domain
      - adapter
      properties:
        domain:
          type: string
          description: Integration domain (content / marketplace / telemetry / access)
        adapter:
          type: string
          description: Which built-in adapter to activate
        brand:
          type: string
          nullable: true
          description: Tenant/brand scope; omit/null for single-brand deployments
        config:
          type: object
          additionalProperties: true
          description: Non-secret configuration (endpoints/region/product-code/etc.)
        secret:
          type: string
          writeOnly: true
          description: 'Write-only secret value. Forwarded to AWS Secrets Manager; only the resulting
            ``secret_ref`` is persisted. Never echoed in any response.'
        active:
          type: boolean
          default: true
          description: Activation state
    ConnectionUpdateRequest:
      type: object
      description: 'Edit a Connection''s non-secret config or rotate its secret. ``secret`` is
        write-only and forwarded to Secrets Manager; never returned.'
      properties:
        domain:
          type: string
        adapter:
          type: string
        brand:
          type: string
          nullable: true
        config:
          type: object
          additionalProperties: true
        secret:
          type: string
          writeOnly: true
          description: Write-only secret value; forwarded to Secrets Manager, never returned.
        active:
          type: boolean
    ConnectionResponse:
      type: object
      description: A single Connection (non-secret config + secret_ref only).
      properties:
        connection:
          $ref: '#/components/schemas/Connection'
    ConnectionListResponse:
      type: object
      description: A list of active Connections (non-secret config + secret_ref only).
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/Connection'
    AdapterDescriptor:
      type: object
      description: A catalog entry describing a built-in adapter.
      required:
      - domain
      - adapter
      properties:
        domain:
          type: string
        adapter:
          type: string
        available:
          type: boolean
          description: Built-in adapters are available in every deployment
        has_active_connection:
          type: boolean
          description: Whether the adapter has an active Connection in this deployment
    AdapterCatalogResponse:
      type: object
      description: The built-in adapter catalog grouped by domain.
      properties:
        adapters:
          type: object
          description: Domain name to list of adapter descriptors
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/AdapterDescriptor'
    ConnectionTestResponse:
      type: object
      description: 'Result of the adapter''s safe, read-only ``test()`` check (fail-informative:
        ``ok`` false with a diagnostic message rather than an error status).'
      required:
      - ok
      properties:
        ok:
          type: boolean
        message:
          type: string
          description: Diagnostic message
    ConnectionStatusResponse:
      type: object
      description: Ongoing health of an active Connection via the adapter''s ``status()``.
      required:
      - healthy
      properties:
        healthy:
          type: boolean
        detail:
          type: string
    ConnectionDeleteResponse:
      type: object
      description: Deactivation acknowledgement.
      properties:
        deleted:
          type: boolean
        connection_id:
          type: string
    ConnectionMirrorResponse:
      type: object
      description: 'Read-only mirrored external config for a domain (e.g. the AWS Marketplace listing
        config mirror). Authored externally, surfaced read-only here (federation rule).'
      properties:
        domain:
          type: string
        mirror:
          type: object
          additionalProperties: true
          description: The read-only mirrored external configuration
    ApiInfo:
      type: object
