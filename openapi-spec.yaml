        ext:
          type: object
          description: Placeholder for implementer-specific extensions
    CompAISystemUse:
      type: object
      description: "CoMP v1.0 \u2014 AISystemUse object. Describes what content the AI system\nwants and how it will use it\
        \ after retrieval.\n\nIMPORTANT: The AI system must have a license agreed a priori to this request.\nIf no license\
        \ has been agreed, set lid to PENDING_REVIEW \u2014 the Package\nresponse will redirect to the licenseurl for the\
        \ agent to negotiate terms\noutside this API.\n"
      required:
      - lid
      - aiauth
      properties:
        lid:
          type: string
          example: lic_medinsight_inference_v1
          description: 'License ID. The pre-agreed license reference the AI system is operating under.

            Must match an active license in /licenses.

            Use PENDING_REVIEW if no license has been agreed yet.

            '
        aiauth:
          type: integer
          description: 'How the AI system plans to authenticate. CoMP List: AI Authentication Methods.

            0 = UserAgent

            1 = IP range

            2 = Token

            3 = WebBot Auth

            4 = Agent ID from IAB Tech Lab Registry

            5 = Other

            '
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          example: 2
        uri:
          type: array
          description: URIs the AI system wants to crawl or access
          items:
            type: string
            format: uri
          maxItems: 10
          example:
          - https://medinsight.com/oncology
          - https://medinsight.com/diagnostics
        scope:
          type: integer
          description: 'Scope of content being requested. CoMP List: Content Scope.

            0 = Full corpus (entire website)

            1 = Section (e.g. /healthcare)

            2 = Date range (content published after YYYY-MM-DD)

            3 = Genre (IAB Content Taxonomy category)

            4 = Topic (keyword-based)

            5 = Curated selection (subset defined by content owner)

            6 = Other

            '
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          example: 1
        function:
          type: array
          description: 'Function(s) the AI system will use the content for. CoMP List: Intended Use Function.

            This field drives RSL license compliance checking.

            0 = all (any automated processing)

            1 = ai-all (any AI use)

            2 = ai-train (training or fine-tuning models)

            3 = ai-input (RAG, grounding, inference, generative responses)

            4 = ai-index (building search index or retrieval database)

            5 = search (traditional search index, NOT AI summaries)

            '
          items:
            type: integer
            enum:
            - 0
            - 1
            - 2
            - 3
            - 4
            - 5
          example:
          - 3
        subfn:
          type: array
          description: 'Sub-function(s) providing additional detail. CoMP List: Sub-Function.

            0 = training

            1 = rag (retrieval-augmented generation)

            2 = grounding

            3 = agent-view (browsing for future action)

            4 = agent-actions (taking action on behalf of user)

            5 = other

            '
          items:
            type: integer
            enum:
            - 0
            - 1
            - 2
            - 3
            - 4
            - 5
          example:
          - 1
        resdis:
          type: integer
          description: "Will results be displayed to a human user?\n0 = No (internal processing only)\n1 = Yes (results shown\
            \ to humans \u2014 citation required if license.citation=1)\n"
          enum:
          - 0
          - 1
          example: 1
        ext:
          type: object
          description: Implementer-specific extensions. `discovery` is the publisher's additive filter contract.
          properties:
            discovery:
              $ref: '#/components/schemas/CompDiscoveryFilters'
          additionalProperties: true
    CompDiscoveryFilters:
      type: object
      anyOf:
      - not:
          required:
          - similarity_threshold
      - required:
        - query
      description: Publisher extension for deterministic CoMP discovery filters. It does not alter the CoMP integer scope code.
      properties:
        cat:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            minLength: 1
        query:
          type: string
          minLength: 1
          maxLength: 512
        similarity_threshold:
          $ref: '#/components/schemas/DiscoverySimilarityThreshold'
        topics:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            minLength: 1
        date_range:
          $ref: '#/components/schemas/DateRange'
        content_ids:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            minLength: 1
        max_results:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
    CompPackageResponse:
      type: object
      description: "CoMP v1.0 Package response. Returned by the content owner in response\nto a CompAISystemRequest. Describes\
        \ the content package, license terms,\nand how to retrieve the full content.\n\nKey fields for RSL integration:\n\
        \  - package.licenseurl: points to /licenses/{license_id} (RSL endpoint)\n  - package.reporturl: points to /log (usage\
        \ reporting endpoint)\n  - package.citation: 1 if attribution is required\n"
      required:
      - package
      properties:
        package:
          $ref: '#/components/schemas/CompPackage'
        _meta:
          $ref: '#/components/schemas/CompResponseMeta'
    CompPackage:
      type: object
      description: CoMP v1.0 Package object. High-level information about the content package.
      required:
      - id
      properties:
        id:
          type: string
          example: PKG-A1B2C3D4
          description: Unique package identifier defined by the content owner
        title:
          type: string
          example: "MedInsight Healthcare Research \u2014 Oncology Section"
          description: Human-readable title of the content package
        seller:
          type: string
          example: medinsight.com
          description: Canonical domain of the content owner offering this package
        packager:
          type: string
          description: Canonical domain of the packaging entity if different from seller
        licenseurl:
          type: string
          format: uri
          example: https://api.medinsight.com/ai-content-monetization/v1/licenses/lic_medinsight_inference_v1
          description: 'URL of the RSL license document governing this content package.

            AI agents MUST fetch this URL to understand permitted uses, attribution

            requirements, and pricing terms before using the content.

            Maps to the /licenses/{license_id} endpoint in this API.

            '
        reporturl:
          type: string
          format: uri
          example: https://api.medinsight.com/ai-content-monetization/v1/log
          description: 'URL where the AI system sends usage reporting. Strongly recommended

            per CoMP spec so publishers can track consumption against license terms.

            Maps to the /log endpoint in this API.

            '
        citation:
          type: integer
          description: "Is citation of the content owner required?\n0 = No\n1 = Yes \u2014 required when resdis=1 (results\
            \ shown to humans).\nAttribution format is specified in the RSL license document\nat licenseurl (attribution_format\
            \ field).\n"
          enum:
          - 0
          - 1
          example: 1
        scope:
          $ref: '#/components/schemas/CompScope'
        retrieval:
          $ref: '#/components/schemas/CompRetrieval'
        ext:
          type: object
    CompScope:
      type: object
      description: CoMP v1.0 Scope object. Describes the content in the package and usage terms.
      properties:
        scope:
          type: integer
          description: 'How much of the corpus is in this package.

            0=Full, 1=Section, 2=Date range, 3=Genre, 4=Topic, 5=Curated, 6=Other

            '
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          example: 5
        ause:
          type: integer
          description: 'Allowed use category.

            0=Commercial, 1=Non-Commercial, 2=Educational, 3=Government,

            4=Personal, 5=BYO License (see licenseurl), 6=Other

            '
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          example: 0
        pricetype:
          type: integer
          description: 'Pricing model for this package.

            0=Per-Use, 1=Per-Query, 2=Per-Token, 3=Flat, 4=Tiered Rate, 5=Other

            '
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          example: 0
        pricetier:
          type: integer
          description: Tier identifier when pricetype=4 (Tiered Rate)
        unitprice:
          type: number
          format: float
          example: 0.001
          description: Price per the defined basis
        cur:
          type: string
          default: USD
          example: USD
          description: Currency using ISO-4217 alpha codes
        country:
          type: array
          description: ISO 3166-1 alpha-2 country codes where this package may be used
          items:
            type: string
          example:
          - US
          - GB
          - DE
        licensedur:
          type: integer
          example: 30
          description: Number of days the license is active after content delivery
        max:
          type: integer
          description: "Is there an upper crawl limit?\n0 = No \u2014 unlimited access within license terms\n1 = Yes \u2014\
            \ see licenseurl for the specific limit\n"
          enum:
          - 0
          - 1
          example: 0
        ctype:
          type: array
          description: 'Content types in this package.

            0=Text, 1=Video, 2=Image, 3=Audio, 4=All, 5=Other

            '
          items:
            type: integer
            enum:
            - 0
            - 1
            - 2
            - 3
            - 4
            - 5
          example:
          - 0
        text:
          type: array
          description: Text asset metadata. One object per individual text asset.
          items:
            $ref: '#/components/schemas/CompTextAsset'
        video:
          type: array
          description: Video asset metadata. One object per individual video asset.
          items:
            $ref: '#/components/schemas/CompVideoAsset'
        image:
          type: array
          description: Image asset metadata. One object per individual image asset.
          items:
            $ref: '#/components/schemas/CompImageAsset'
        audio:
          type: array
          description: Audio asset metadata. One object per individual audio asset.
          items:
            $ref: '#/components/schemas/CompAudioAsset'
        ext:
          type: object
    CompRetrieval:
      type: object
      description: 'CoMP v1.0 Retrieval object. Tells the AI system how to access the full

        content once authorization has been granted (payment verified by WAF).

        '
      properties:
        auth:
          type: integer
          description: 'Authorization type required to access content.

            0=None, 1=api_key, 2=oauth2, 3=SSL, 4=Other

            '
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          example: 1
        endpoint:
          type: string
          format: uri
          example: https://api.medinsight.com/ai-content-monetization/v1/content
          description: 'Entry point URI to access content after authorization: this API''s `GET /content`

            read on the plane that served the query. Each Text asset''s `ext.url` is the authoritative

            per-item link; `ext` here documents the available read forms.

            '
        type:
          type: array
          description: 'Available delivery formats. CoMP List: Endpoint / Delivery Format.

            0=HTML, 1=RSS, 2=API, 3=MCP, 4=NLWeb, 5=XML, 6=NewsML, 7=Other

            This API advertises 2 (API) for its `GET /content` read.

            '
          items:
            type: integer
            enum:
            - 0
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
            - 7
          example:
          - 2
        ext:
          $ref: '#/components/schemas/CompRetrievalExt'
    CompRetrievalExt:
      type: object
      description: 'Publisher extension: RFC 6570 level-1 templates for the per-item reads available

        to the caller. `read_by_url` is offered on the partner plane only.'
      required:
      - read_by_id
      properties:
        read_by_url:
          type: string
          example: https://api.example.com/v1/content?url={canonical_url}
        read_by_id:
          type: string
          example: https://api.example.com/v1/content?content_id={content_id}
    CompTextExt:
      type: object
      description: 'Publisher extension on each Text asset: the item''s identity and the read reference

        the caller can follow with the credential that admitted the query.'
      required:
      - content_id
      - url
      properties:
        content_id:
          type: string
          example: cnt_a1b2c3d4e5f6
        url:
          type: string
          format: uri
          example: https://api.example.com/v1/content?url=https%3A%2F%2Fpublisher.example%2Farticle
    CompTextAsset:
      type: object
      description: 'CoMP v1.0 Text asset. One object per individual text-based asset

        in the package. Includes GEO enrichment fields (answer_capsule,

        faq_schema) produced by the content ingestion pipeline.

        '
      properties:
        title:
          type: string
          example: New AI System Achieves 95% Accuracy in Early Cancer Detection
        cattax:
          type: integer
          default: 9
          example: 9
          description: 'Taxonomy in use. Default 9 = IAB Content Category Taxonomy 3.1.

            See AdCOM List: Category Taxonomies for all values.

            '
        cat:
          type: array
          description: IAB Tech Lab content category IDs
          items:
            type: integer
          example:
          - 111
          - 126
        language:
          type: array
          description: Content language using ISO-639-1-alpha-2
          items:
            type: string
          example:
          - en
        wordcount:
          type: array
          items:
            type: integer
          example:
          - 1200
          description: Count of whitespace-delimited words in the main body
        pubdate:
          type: string
          format: date-time
          example: '2026-06-12T00:00:00Z'
          description: Original publication date/time in ISO-8601
        published:
          type: integer
          default: 1
          description: 'Publication status.

            0=Not specified, 1=Previously published, 2=Unpublished/archival

            '
          enum:
          - 0
          - 1
          - 2
          example: 1
        update:
          type: string
          format: date-time
          description: Most recent substantive update date/time in ISO-8601
        author:
          type: array
          items:
            type: string
          example:
          - Dr. Sarah Johnson
          description: Author name(s)
        sourcetype:
          type: integer
          description: Creation source. 0=Human, 1=AI, 2=Hybrid
          enum:
          - 0
          - 1
          - 2
          example: 0
        provenance:
          type: integer
          description: Provenance available? 0=No, 1=Yes
          enum:
          - 0
          - 1
          example: 1
        provent:
          type: string
          example: c2pa.org
          description: 'Canonical domain of the provenance entity.

            Required if provenance=1.

            '
        answer_capsule:
          type: string
          example: Stanford researchers developed an AI system that detects early-stage pancreatic cancer with 95% accuracy,
            outperforming specialist physicians. Analyzed 10,000 patient scans over three years. Published Nature Medicine,
            June 2026.
          description: 'GEO enrichment field (non-CoMP spec extension).

            40-60 word self-contained factual summary suitable for direct AI citation.

            Generated by the content ingestion pipeline via Bedrock.

            '
        faq_schema:
          type: array
          description: 'GEO enrichment field (non-CoMP spec extension).

            FAQ pairs extracted from the article by the ingestion pipeline.

            Structured per Schema.org FAQPage format.

            '
          items:
            type: object
            properties:
              question:
                type: string
                example: How accurate is Stanford AI cancer detection?
              answer:
                type: string
                example: 95% accuracy in detecting early-stage pancreatic cancer across 10,000 trial cases.
        canonical_url:
          type: string
          format: uri
          example: https://medinsight.com/articles/ai-cancer-detection-2026
          description: Canonical URL of the original article. Used in attribution.
        markdown_schema_version:
          $ref: '#/components/schemas/MarkdownSchemaVersion'
        similarity_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.94
          description: Cosine similarity score from semantic vector search (non-CoMP extension)
        ext:
          $ref: '#/components/schemas/CompTextExt'
    CompVideoAsset:
      type: object
